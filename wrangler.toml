# wrangler configuration.
#
# This project has no Worker -- the tool talks to D1 over the REST API from
# Python. wrangler is here for the three jobs it does better than anything else:
# applying migrations, exporting backups, and Time Travel.
#
# Nothing in this file is a secret. A database_id is an identifier, not a
# credential: using it requires the API token, which lives in
# $XDG_CONFIG_HOME/kicad_partlib/secrets.json and is never committed.
# See docs/d1-setup.md.

name = "kicad-partlib"
compatibility_date = "2026-01-01"

# What makes `wrangler d1 migrations` find this repo's migrations/ directory.
migrations_dir = "migrations"

# --------------------------------------------------------------------------
# The real database
# --------------------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "kicad-partlib"
database_id   = "4f78a0b2-72b6-4b09-ab45-0272a0e08b9d"

# --------------------------------------------------------------------------
# Staging, for rehearsing a migration against a copy of real data
# --------------------------------------------------------------------------
# Migrations are the one operation that can damage the only copy of the
# inventory, and Time Travel restores all-or-nothing -- so recovering from a bad
# one would also discard every stock event recorded since. Rehearse here first:
#
#   wrangler d1 export  kicad-partlib --output=/tmp/seed.sql
#   wrangler d1 execute kicad-partlib-staging --file=/tmp/seed.sql
#   wrangler d1 migrations apply kicad-partlib-staging    # rehearse
#   wrangler d1 migrations apply kicad-partlib            # then production
[[d1_databases]]
binding       = "STAGING"
database_name = "kicad-partlib-staging"
database_id   = "5ba4e898-3277-4331-8ad7-827bac9ef522"
