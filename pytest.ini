[pytest]
testpaths = tests
pythonpath = . scripts

# Warnings are errors. Carried over from the sibling repo, where it is called
# non-negotiable: a DeprecationWarning that nobody reads becomes a breakage on
# the next Python release, and this suite has to keep working on two machines
# and three CI platforms.
#
# PySide6 and shiboken emit warnings that this promotes to failures. Each
# ignore below must name WHY it exists and be removed when it stops being
# true -- never widen this into a blanket filter.
filterwarnings = error
